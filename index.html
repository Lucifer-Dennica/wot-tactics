<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WoT Tactics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; background: #16213e; position: relative; }

        #login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; background: #0f3460; }
        #login h1 { font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 10px #e94560; }
        .room-panel { background: #1a1a40; padding: 20px; border-radius: 12px; width: 90%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); }
        .room-panel input, .room-panel button { width: 100%; padding: 10px; margin: 6px 0; border: none; border-radius: 6px; font-size: 1rem; }
        .room-panel input { background: #2a2a5a; color: #fff; }
        .room-panel button { background: #e94560; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .room-panel button:hover { background: #c73652; }
        .search-box { width: 100%; padding: 10px; margin: 6px 0; border: none; border-radius: 6px; background: #2a2a5a; color: #fff; font-size: 1rem; }
        .room-list { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .room-item { background: #2a2a5a; padding: 12px; margin: 6px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .room-item .name { font-weight: bold; }
        .room-item .info { color: #aaa; font-size: 0.9rem; }
        .room-item .actions { display: flex; gap: 6px; }
        .room-item .actions button { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .room-item .join-btn { background: #1b9cfc; color: #fff; }
        .room-item .delete-btn { background: #c0392b; color: #fff; }
        .error-msg { color: #f5a623; margin-top: 8px; }

        #game { display: none; flex-direction: column; height: 100%; width: 100%; background: #1a1a2e; }
        #top-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 10px; background: #16213e; border-bottom: 2px solid #0f3460; align-items: center; flex-shrink: 0; min-height: 40px; }
        #top-bar select, #top-bar button { padding: 4px 10px; border: none; border-radius: 4px; background: #2a2a5a; color: #fff; font-size: 0.85rem; cursor: pointer; height: 30px; }
        #top-bar button { background: #e94560; }
        #top-bar button:hover { background: #c73652; }
        #top-bar .room-info { margin-left: auto; font-weight: bold; color: #f5a623; font-size: 0.9rem; }
        .room-name-label { font-weight: bold; font-size: 0.9rem; white-space: nowrap; }

        #canvas-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }
        #canvas-container { flex: 1; position: relative; background: #0f0f1f; }
        #canvas-container canvas { display: block; width: 100%; height: 100%; background: #222; cursor: crosshair; touch-action: none; }

        /* Панель инструментов */
        #tools {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 10px;
            background: #16213e;
            border-right: 2px solid #0f3460;
            width: 180px;
            flex-shrink: 0;
            overflow-y: auto;
            max-height: 100%;
        }
        #tools label { font-size: 0.75rem; color: #aaa; margin-bottom: -2px; }
        #tools .tool-group { display: flex; flex-wrap: wrap; gap: 4px; }
        #tools .tool-btn {
            width: 30px; height: 30px;
            border: 2px solid #444;
            border-radius: 4px;
            background: #2a2a5a;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }
        #tools .tool-btn.active { border-color: #e94560; background: #3a3a7a; }
        #tools .color-picker { width: 100%; height: 28px; border: none; background: transparent; cursor: pointer; }
        #tools input[type="range"] { width: 100%; accent-color: #e94560; }
        #tools .icon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        #tools .icon-btn {
            width: 40px; height: 40px;
            border: 2px solid #444;
            border-radius: 4px;
            background: #2a2a5a;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        #tools .icon-btn.active { border-color: #e94560; background-color: #3a3a7a; }
        .action-buttons { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .action-buttons button {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            background: #2a2a5a;
            min-width: 50px;
        }
        .action-buttons .undo-btn { background: #2a5a5a; }
        .action-buttons .undo-btn:hover { background: #1a4a4a; }
        .action-buttons .clear-btn { background: #c0392b; }
        .action-buttons .clear-btn:hover { background: #a03222; }

        /* Мобильная адаптация */
        @media (max-width: 700px) {
            #tools { width: 140px; padding: 6px; gap: 4px; }
            #tools .tool-btn { width: 26px; height: 26px; font-size: 0.9rem; }
            #tools .icon-btn { width: 34px; height: 34px; font-size: 1.2rem; }
            #top-bar select, #top-bar button { font-size: 0.75rem; padding: 2px 8px; height: 26px; }
            #top-bar { gap: 4px; padding: 4px 8px; }
        }

        @media (max-width: 500px) {
            #canvas-wrapper { flex-direction: column; }
            #tools {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                height: auto;
                max-height: 140px;
                border-right: none;
                border-bottom: 2px solid #0f3460;
                padding: 4px 6px;
                gap: 4px;
                align-items: center;
                overflow-y: auto;
            }
            #tools label { display: none; }
            #tools .tool-group { flex-wrap: wrap; }
            #tools .tool-btn { width: 32px; height: 32px; font-size: 1rem; }
            #tools .icon-btn { width: 38px; height: 38px; font-size: 1.3rem; }
            #tools .color-picker { width: 30px; height: 30px; flex-shrink: 0; }
            #tools input[type="range"] { 
                width: 80px;
                flex-shrink: 0;
                margin: 0 4px;
            }
            .action-buttons { flex-wrap: wrap; }
            .action-buttons button { font-size: 0.7rem; padding: 4px 8px; min-width: 40px; flex: 0 1 auto; }
            #top-bar { flex-wrap: wrap; gap: 3px; padding: 3px 6px; min-height: 30px; }
            #top-bar select, #top-bar button { font-size: 0.6rem; padding: 1px 4px; height: 22px; }
            .room-name-label { font-size: 0.7rem; }
            #top-bar .room-info { font-size: 0.65rem; }
        }

        @media (max-width: 400px) {
            #tools { max-height: 120px; padding: 2px 4px; }
            #tools .tool-btn { width: 28px; height: 28px; font-size: 0.8rem; }
            #tools .icon-btn { width: 34px; height: 34px; font-size: 1.1rem; }
            #tools input[type="range"] { width: 60px; }
            #top-bar select, #top-bar button { font-size: 0.5rem; padding: 1px 3px; height: 18px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="login">
        <h1>⚔️ WoT Tactics</h1>
        <div class="room-panel">
            <h3>Создать комнату</h3>
            <input type="text" id="new-room-name" placeholder="Название комнаты">
            <input type="text" id="new-room-password" placeholder="Пароль (необязательно)">
            <button id="create-room-btn">➕ Создать</button>
            <div id="create-error" class="error-msg"></div>
            <hr style="margin:20px 0; border-color:#444;">
            <h3>Доступные комнаты</h3>
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Поиск по названию...">
            <div id="room-list" class="room-list"></div>
            <div id="join-error" class="error-msg"></div>
            <div id="status-msg" style="color:#888; text-align:center; margin-top:10px;"></div>
        </div>
    </div>
    <div id="game">
        <div id="top-bar">
            <span class="room-name-label">Комната: <span id="current-room-name">—</span></span>
            <select id="map-select"><option value="">Выберите карту</option></select>
            <button id="apply-map-btn">Применить</button>
            <span class="room-info" id="player-count">👥 1</span>
            <button id="delete-room-btn" style="background:#c0392b; display:none;">🗑️</button>
            <button id="leave-room-btn" style="background:#c0392b;">Выйти</button>
        </div>
        <div id="canvas-wrapper">
            <div id="tools">
                <!-- Инструменты -->
                <div class="tool-group">
                    <button class="tool-btn active" data-tool="freehand">🖊️</button>
                    <button class="tool-btn" data-tool="pen">✏️</button>
                    <button class="tool-btn" data-tool="rect">▭</button>
                    <button class="tool-btn" data-tool="circle">●</button>
                    <button class="tool-btn" data-tool="arrow">➡️</button>
                    <button class="tool-btn" data-tool="select">🖱️</button>
                    <button class="tool-btn" data-tool="eraser">🧹</button>
                </div>

                <!-- Цвет и Толщина (теперь на одной строке) -->
                <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%;">
                    <input type="color" class="color-picker" id="color-picker" value="#ff0000" style="flex-shrink:0;">
                    <input type="range" id="line-width" min="1" max="20" value="3" style="flex:1; min-width:60px; height:6px;">
                    <span style="font-size:0.7rem; color:#aaa; flex-shrink:0;" id="width-label">3</span>
                </div>

                <!-- Иконки танков (увеличены) -->
                <div class="icon-grid" id="icon-grid"></div>

                <!-- Кнопки действий -->
                <div class="action-buttons">
                    <button class="undo-btn" id="undo-btn">↩️ Отменить</button>
                    <button class="clear-btn" id="clear-btn">🗑️ Очистить</button>
                </div>
            </div>
            <div id="canvas-container">
                <canvas id="map-canvas"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ========== НАСТРОЙКИ ==========
    const WS_URL = 'wss://wot-tactics-server.onrender.com';
    const ICONS_PATH = 'icons/';
    const MAPS_PATH = 'maps/';

    const MAPS = [
        { name: 'Прохоровка', file: 'prokhorovka' },
        { name: 'Рудники', file: 'mines' },
        { name: 'Химмельсдорф', file: 'himmelsdorf' },
        { name: 'Утёс', file: 'cliff' },
        { name: 'Эрленберг', file: 'erlenberg' },
    ];

    // ========== СОСТОЯНИЕ ==========
    const state = {
        roomName: null,
        map: null,
        tool: 'freehand',
        color: '#ff0000',
        lineWidth: 3,
        icon: null,
        isDrawing: false,
        drawings: [],
        history: [],
        players: new Set(),
        ws: null,
        myPlayerId: null,
        isCreator: false,
        freehandPoints: [],
        selectedIconIndex: -1,
        dragOffsetX: 0, dragOffsetY: 0,
        isDragging: false,
        imgOffsetX: 0,
        imgOffsetY: 0,
        imgDrawW: 0,
        imgDrawH: 0,
        imgWidth: 1000,
        imgHeight: 1000,
        tempDrawings: [],
    };

    // ========== DOM ==========
    const loginScreen = document.getElementById('login');
    const gameScreen = document.getElementById('game');
    const roomListEl = document.getElementById('room-list');
    const searchInput = document.getElementById('search-input');
    const createError = document.getElementById('create-error');
    const joinError = document.getElementById('join-error');
    const statusMsg = document.getElementById('status-msg');
    const newRoomName = document.getElementById('new-room-name');
    const newRoomPass = document.getElementById('new-room-password');
    const createBtn = document.getElementById('create-room-btn');
    const currentRoomNameSpan = document.getElementById('current-room-name');
    const mapSelect = document.getElementById('map-select');
    const applyMapBtn = document.getElementById('apply-map-btn');
    const leaveBtn = document.getElementById('leave-room-btn');
    const deleteRoomBtn = document.getElementById('delete-room-btn');
    const playerCountSpan = document.getElementById('player-count');
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const toolBtns = document.querySelectorAll('.tool-btn');
    const colorPicker = document.getElementById('color-picker');
    const lineWidthInput = document.getElementById('line-width');
    const widthLabel = document.getElementById('width-label');
    const iconGrid = document.getElementById('icon-grid');
    const undoBtn = document.getElementById('undo-btn');
    const clearBtn = document.getElementById('clear-btn');

    // ========== ИКОНКИ ==========
    const TANK_CLASSES = [
        { id: 'lt', label: 'Лёгкий' },
        { id: 'mt', label: 'Средний' },
        { id: 'ht', label: 'Тяжёлый' },
        { id: 'td', label: 'ПТ-САУ' },
        { id: 'spg', label: 'Артиллерия' }
    ];

    function loadIcons() {
        iconGrid.innerHTML = '';
        TANK_CLASSES.forEach(cls => {
            const btn = document.createElement('button');
            btn.className = 'icon-btn';
            btn.dataset.icon = cls.id;
            btn.title = cls.label;
            btn.style.backgroundImage = `url(${ICONS_PATH}${cls.id}.png)`;
            btn.style.backgroundColor = '#2a2a5a';
            btn.style.backgroundSize = 'contain';
            btn.style.backgroundPosition = 'center';
            btn.style.backgroundRepeat = 'no-repeat';
            btn.addEventListener('click', () => {
                document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.icon = cls.id;
                state.tool = 'icon';
                canvas.style.cursor = 'crosshair';
            });
            iconGrid.appendChild(btn);
        });
    }

    function populateMapSelect() {
        mapSelect.innerHTML = '<option value="">Выберите карту</option>';
        MAPS.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.file;
            opt.textContent = m.name;
            mapSelect.appendChild(opt);
        });
        if (MAPS.length > 0) mapSelect.value = MAPS[0].file;
    }

    // ========== КООРДИНАТЫ ==========
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if (clientX == null) return { x:0, y:0 };
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function canvasToImage(cx, cy) {
        if (state.imgDrawW === 0 || state.imgDrawH === 0) return { x: 0, y: 0 };
        let ix = (cx - state.imgOffsetX) / state.imgDrawW * state.imgWidth;
        let iy = (cy - state.imgOffsetY) / state.imgDrawH * state.imgHeight;
        return { x: ix, y: iy };
    }

    function imageToCanvas(ix, iy) {
        if (state.imgWidth === 0 || state.imgHeight === 0) return { x: 0, y: 0 };
        let cx = (ix / state.imgWidth) * state.imgDrawW + state.imgOffsetX;
        let cy = (iy / state.imgHeight) * state.imgDrawH + state.imgOffsetY;
        return { x: cx, y: cy };
    }

    function toImageRelative(ix, iy) {
        return { x: ix / state.imgWidth, y: iy / state.imgHeight };
    }
    function fromImageRelative(rx, ry) {
        return { x: rx * state.imgWidth, y: ry * state.imgHeight };
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    async function init() {
        state.myPlayerId = localStorage.getItem('wot_player_id');
        if (!state.myPlayerId) {
            state.myPlayerId = 'player_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem('wot_player_id', state.myPlayerId);
        }
        loadIcons();
        populateMapSelect();
        connectWebSocket();

        createBtn.addEventListener('click', onCreateRoom);
        leaveBtn.addEventListener('click', onLeaveRoom);
        applyMapBtn.addEventListener('click', onApplyMap);
        deleteRoomBtn.addEventListener('click', onDeleteRoom);
        searchInput.addEventListener('input', renderRoomList);
        undoBtn.addEventListener('click', onUndo);
        clearBtn.addEventListener('click', onClearDrawings);

        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.tool = btn.dataset.tool;
                state.icon = null;
                document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
                canvas.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
            });
        });
        colorPicker.addEventListener('input', (e) => state.color = e.target.value);
        lineWidthInput.addEventListener('input', (e) => {
            state.lineWidth = parseInt(e.target.value, 10);
            widthLabel.textContent = state.lineWidth;
        });
        widthLabel.textContent = state.lineWidth;

        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mouseleave', onMouseUp);
        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd, { passive: false });

        window.addEventListener('resize', () => {
            if (state.roomName && state.map) renderDrawings();
        });
    }

    // ========== WEBSOCKET ==========
    function connectWebSocket() {
        if (state.ws && state.ws.readyState === WebSocket.OPEN) return;
        state.ws = new WebSocket(WS_URL);
        state.ws.onopen = () => {
            statusMsg.textContent = 'Подключено к серверу';
            state.ws.send(JSON.stringify({ type: 'get_rooms' }));
        };
        state.ws.onmessage = (e) => {
            try { const data = JSON.parse(e.data); handleServerMessage(data); } catch(err) { console.error(err); }
        };
        state.ws.onerror = () => { statusMsg.textContent = 'Ошибка соединения'; };
        state.ws.onclose = () => {
            statusMsg.textContent = 'Соединение потеряно. Переподключение...';
            setTimeout(connectWebSocket, 3000);
        };
    }

    function sendToServer(msg) {
        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
            state.ws.send(JSON.stringify(msg));
        }
    }

    let roomsCache = [];

    function handleServerMessage(data) {
        switch (data.type) {
            case 'room_list':
                roomsCache = data.rooms;
                renderRoomList();
                break;
            case 'create_success':
                createError.textContent = '';
                joinRoom(data.roomName);
                break;
            case 'delete_success':
                break;
            case 'join_success':
                state.roomName = data.roomName;
                state.map = data.map || (MAPS.length > 0 ? MAPS[0].file : null);
                state.drawings = data.drawings || [];
                state.history = [];
                const room = roomsCache.find(r => r.name === data.roomName);
                state.isCreator = room ? room.creatorId === state.myPlayerId : false;
                showGameScreen();
                if (state.map) loadMap(state.map);
                break;
            case 'player_joined':
                state.players.add(data.playerId);
                updatePlayerCount();
                break;
            case 'draw':
                state.drawings.push(data.payload);
                pushHistory();
                renderDrawings();
                break;
            case 'draw_freehand':
                state.drawings.push({ type: 'freehand', ...data.payload });
                pushHistory();
                renderDrawings();
                break;
            case 'update_icon':
                const idx = data.index;
                if (state.drawings[idx] && state.drawings[idx].type === 'icon') {
                    state.drawings[idx].x = data.newX;
                    state.drawings[idx].y = data.newY;
                    renderDrawings();
                }
                break;
            case 'clear':
                state.drawings = [];
                pushHistory();
                renderDrawings();
                break;
            case 'load_map':
                state.map = data.map;
                loadMap(state.map);
                break;
            case 'room_closed':
                alert('Комната была удалена создателем');
                onLeaveRoom();
                break;
            case 'sync_drawings':
                state.drawings = data.drawings;
                renderDrawings();
                break;
            case 'error':
                const errMsg = data.message || 'Ошибка';
                if (loginScreen.style.display !== 'none') {
                    createError.textContent = errMsg;
                    joinError.textContent = errMsg;
                } else {
                    alert('Ошибка: ' + errMsg);
                }
                break;
            default: break;
        }
    }

    // ========== ИСТОРИЯ ==========
    function pushHistory() {
        state.history.push(JSON.stringify(state.drawings));
        if (state.history.length > 50) state.history.shift();
    }

    function onUndo() {
        if (state.drawings.length === 0) return;
        state.drawings.pop();
        renderDrawings();
        sendToServer({ type: 'sync_drawings', drawings: state.drawings });
    }

    // ========== КОМНАТЫ ==========
    function onCreateRoom() {
        const name = newRoomName.value.trim();
        const password = newRoomPass.value.trim() || null;
        if (!name) { createError.textContent = 'Введите название'; return; }
        createError.textContent = '';
        sendToServer({ type: 'create_room', name, password, creatorId: state.myPlayerId });
    }

    function joinRoom(roomName) {
        sendToServer({ type: 'join_room', roomName, playerId: state.myPlayerId });
    }

    function onDeleteRoom() {
        if (!state.roomName) return;
        if (!confirm(`Удалить комнату "${state.roomName}"?`)) return;
        sendToServer({ type: 'delete_room', roomName: state.roomName, deleterId: state.myPlayerId });
    }

    function onLeaveRoom() {
        state.roomName = null;
        state.drawings = [];
        state.history = [];
        state.players = new Set();
        state.isCreator = false;
        gameScreen.style.display = 'none';
        loginScreen.style.display = 'flex';
        deleteRoomBtn.style.display = 'none';
        sendToServer({ type: 'get_rooms' });
    }

    function renderRoomList() {
        const search = searchInput.value.toLowerCase().trim();
        const filtered = roomsCache.filter(r => r.name.toLowerCase().includes(search));
        roomListEl.innerHTML = '';
        if (filtered.length === 0) {
            roomListEl.innerHTML = '<div style="color:#888;text-align:center;padding:10px;">Нет комнат</div>';
            return;
        }
        filtered.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.textContent = room.name + (room.hasPassword ? ' 🔒' : '');
            const infoSpan = document.createElement('span');
            infoSpan.className = 'info';
            infoSpan.textContent = `👥 ${room.playerCount}`;
            const actions = document.createElement('div');
            actions.className = 'actions';
            const joinBtn = document.createElement('button');
            joinBtn.className = 'join-btn';
            joinBtn.textContent = 'Войти';
            joinBtn.addEventListener('click', () => {
                if (room.hasPassword) {
                    const pwd = prompt('Введите пароль:');
                    if (pwd === null) return;
                }
                joinRoom(room.name);
            });
            actions.appendChild(joinBtn);
            const left = document.createElement('div');
            left.style.display = 'flex';
            left.style.alignItems = 'center';
            left.style.gap = '8px';
            left.appendChild(nameSpan);
            left.appendChild(infoSpan);
            div.appendChild(left);
            div.appendChild(actions);
            roomListEl.appendChild(div);
        });
    }

    // ========== ИГРОВОЙ ЭКРАН ==========
    function showGameScreen() {
        loginScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
        currentRoomNameSpan.textContent = state.roomName;
        if (state.map) mapSelect.value = state.map;
        else if (MAPS.length > 0) mapSelect.value = MAPS[0].file;
        updatePlayerCount();
        deleteRoomBtn.style.display = state.isCreator ? 'inline-block' : 'none';
    }

    function updatePlayerCount() {
        playerCountSpan.textContent = '👥 ' + state.players.size;
    }

    // ========== КАРТЫ ==========
    function loadMap(mapName) {
        if (!mapName) return;
        state.map = mapName;
        const extensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp'];
        let currentIndex = 0;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        function tryLoad() {
            if (currentIndex >= extensions.length) {
                drawFallbackScene(mapName);
                return;
            }
            const url = `${MAPS_PATH}${mapName}${extensions[currentIndex]}`;
            img.src = url;
        }
        img.onload = function() {
            state.imgWidth = img.width;
            state.imgHeight = img.height;
            drawFullScene(img);
        };
        img.onerror = function() { currentIndex++; tryLoad(); };
        tryLoad();
    }

    function drawFullScene(img) {
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        ctx.clearRect(0, 0, rect.width, rect.height);

        const aspect = img.width / img.height;
        let drawW = rect.width;
        let drawH = rect.width / aspect;
        if (drawH > rect.height) {
            drawH = rect.height;
            drawW = rect.height * aspect;
        }
        const offsetX = (rect.width - drawW) / 2;
        const offsetY = (rect.height - drawH) / 2;
        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

        state.imgOffsetX = offsetX;
        state.imgOffsetY = offsetY;
        state.imgDrawW = drawW;
        state.imgDrawH = drawH;

        drawAllDrawings(rect);
    }

    function drawFallbackScene(mapName) {
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        ctx.clearRect(0, 0, rect.width, rect.height);
        ctx.fillStyle = '#2a2a4a';
        ctx.fillRect(0, 0, rect.width, rect.height);
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 10; i++) {
            const x = (i/10)*rect.width, y = (i/10)*rect.height;
            ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,rect.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(rect.width,y); ctx.stroke();
        }
        ctx.fillStyle = '#aaa';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Карта: ${mapName} (не найдена)`, 20, 40);
        state.imgWidth = 1000;
        state.imgHeight = 1000;
        state.imgOffsetX = 0;
        state.imgOffsetY = 0;
        state.imgDrawW = rect.width;
        state.imgDrawH = rect.height;
        drawAllDrawings(rect);
    }

    // ========== ОТРИСОВКА ==========
    function drawAllDrawings(rect) {
        const allDrawings = state.drawings.concat(state.tempDrawings);
        allDrawings.forEach((item, index) => {
            if (item.type === 'icon') drawIcon(item, index);
            else if (item.type === 'freehand') drawFreehand(item);
            else drawShape(item);
        });
    }

    function drawShape(item) {
        const { tool, color, lineWidth, x1, y1, x2, y2 } = item;
        const p1 = fromImageRelative(x1, y1);
        const p2 = fromImageRelative(x2, y2);
        const c1 = imageToCanvas(p1.x, p1.y);
        const c2 = imageToCanvas(p2.x, p2.y);

        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = lineWidth || 2;
        ctx.beginPath();
        switch (tool) {
            case 'pen':
                ctx.moveTo(c1.x, c1.y);
                ctx.lineTo(c2.x, c2.y);
                ctx.stroke();
                break;
            case 'rect':
                const rx = Math.min(c1.x, c2.x);
                const ry = Math.min(c1.y, c2.y);
                const rw = Math.abs(c2.x - c1.x);
                const rh = Math.abs(c2.y - c1.y);
                ctx.strokeRect(rx, ry, rw, rh);
                break;
            case 'circle':
                const cx = (c1.x + c2.x)/2;
                const cy = (c1.y + c2.y)/2;
                const rad = Math.hypot(c2.x - c1.x, c2.y - c1.y)/2;
                ctx.arc(cx, cy, rad, 0, Math.PI*2);
                ctx.stroke();
                break;
            case 'arrow':
                const angle = Math.atan2(c2.y - c1.y, c2.x - c1.x);
                const headLen = 12;
                ctx.moveTo(c1.x, c1.y);
                ctx.lineTo(c2.x, c2.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(c2.x, c2.y);
                ctx.lineTo(c2.x - headLen*Math.cos(angle-0.4), c2.y - headLen*Math.sin(angle-0.4));
                ctx.moveTo(c2.x, c2.y);
                ctx.lineTo(c2.x - headLen*Math.cos(angle+0.4), c2.y - headLen*Math.sin(angle+0.4));
                ctx.stroke();
                break;
            default: break;
        }
        ctx.restore();
    }

    function drawFreehand(item) {
        const { points, color, lineWidth } = item;
        if (!points || points.length < 2) return;
        const canvasPoints = points.map(p => {
            const imgP = fromImageRelative(p[0], p[1]);
            return imageToCanvas(imgP.x, imgP.y);
        });
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth || 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(canvasPoints[0].x, canvasPoints[0].y);
        for (let i = 1; i < canvasPoints.length; i++) {
            ctx.lineTo(canvasPoints[i].x, canvasPoints[i].y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawIcon(item, index) {
        const { icon, x, y } = item;
        const imgP = fromImageRelative(x, y);
        const c = imageToCanvas(imgP.x, imgP.y);
        ctx.save();
        const img = new Image();
        img.src = `${ICONS_PATH}${icon}.png`;
        img.onload = () => { ctx.drawImage(img, c.x-16, c.y-16, 32, 32); };
        img.onerror = () => {
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const symbols = { lt:'🚗', mt:'🚙', ht:'🚛', td:'🚜', spg:'💥' };
            ctx.fillStyle = '#fff';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 8;
            ctx.fillText(symbols[icon] || '?', c.x, c.y);
        };
        if (state.tool === 'select' && state.selectedIconIndex === index) {
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.strokeRect(c.x-20, c.y-20, 40, 40);
        }
        ctx.restore();
    }

    function renderDrawings() {
        if (state.map) loadMap(state.map);
    }

    // ========== ОБРАБОТЧИКИ МЫШИ ==========
    let lastX = 0, lastY = 0;

    function onMouseDown(e) { e.preventDefault(); const {x,y}=getCanvasCoords(e); lastX=x; lastY=y; handlePointerDown(x,y); }
    function onTouchStart(e) { e.preventDefault(); const {x,y}=getCanvasCoords(e); lastX=x; lastY=y; handlePointerDown(x,y); }
    function onMouseMove(e) { e.preventDefault(); const {x,y}=getCanvasCoords(e); lastX=x; lastY=y; handlePointerMove(x,y); }
    function onTouchMove(e) { e.preventDefault(); const {x,y}=getCanvasCoords(e); lastX=x; lastY=y; handlePointerMove(x,y); }
    function onMouseUp(e) { e.preventDefault(); handlePointerUp(); }
    function onTouchEnd(e) { e.preventDefault(); handlePointerUp(); }

    function handlePointerDown(cx, cy) {
        const imgPos = canvasToImage(cx, cy);
        const rel = toImageRelative(imgPos.x, imgPos.y);

        state.startX = rel.x;
        state.startY = rel.y;

        // Ластик
        if (state.tool === 'eraser') {
            let minDist = Infinity;
            let minIndex = -1;
            state.drawings.forEach((item, i) => {
                let dist;
                if (item.type === 'icon') {
                    dist = Math.hypot(rel.x - item.x, rel.y - item.y);
                } else if (item.type === 'freehand') {
                    if (item.points && item.points.length > 0) {
                        const avgX = item.points.reduce((s,p) => s+p[0], 0) / item.points.length;
                        const avgY = item.points.reduce((s,p) => s+p[1], 0) / item.points.length;
                        dist = Math.hypot(rel.x - avgX, rel.y - avgY);
                    } else dist = Infinity;
                } else {
                    const midX = (item.x1 + item.x2) / 2;
                    const midY = (item.y1 + item.y2) / 2;
                    dist = Math.hypot(rel.x - midX, rel.y - midY);
                }
                if (dist < minDist) {
                    minDist = dist;
                    minIndex = i;
                }
            });
            if (minIndex !== -1 && minDist < 0.05) {
                state.drawings.splice(minIndex, 1);
                pushHistory();
                renderDrawings();
                sendToServer({ type: 'sync_drawings', drawings: state.drawings });
            }
            return;
        }

        if (state.tool === 'select') {
            let foundIndex = -1;
            for (let i=state.drawings.length-1; i>=0; i--) {
                const item = state.drawings[i];
                if (item.type === 'icon') {
                    const dist = Math.hypot(rel.x - item.x, rel.y - item.y);
                    if (dist < 0.02) {
                        foundIndex = i;
                        break;
                    }
                }
            }
            if (foundIndex !== -1) {
                state.selectedIconIndex = foundIndex;
                state.isDragging = true;
                const icon = state.drawings[foundIndex];
                state.dragOffsetX = rel.x - icon.x;
                state.dragOffsetY = rel.y - icon.y;
                renderDrawings();
                return;
            } else {
                state.selectedIconIndex = -1;
                renderDrawings();
                return;
            }
        }

        if (state.icon) {
            const item = { type: 'icon', icon: state.icon, x: rel.x, y: rel.y };
            state.drawings.push(item);
            pushHistory();
            sendToServer({ type: 'draw', payload: item });
            renderDrawings();
            return;
        }

        state.isDrawing = true;
        if (state.tool === 'freehand') {
            state.freehandPoints = [[rel.x, rel.y]];
            state.tempDrawings = [{ type: 'freehand', points: state.freehandPoints, color: state.color, lineWidth: state.lineWidth }];
        }
    }

    function handlePointerMove(cx, cy) {
        const imgPos = canvasToImage(cx, cy);
        const rel = toImageRelative(imgPos.x, imgPos.y);

        if (state.tool === 'select' && state.isDragging && state.selectedIconIndex !== -1) {
            const icon = state.drawings[state.selectedIconIndex];
            if (icon) {
                icon.x = rel.x - state.dragOffsetX;
                icon.y = rel.y - state.dragOffsetY;
                renderDrawings();
                sendToServer({ type: 'update_icon', index: state.selectedIconIndex, newX: icon.x, newY: icon.y });
            }
            return;
        }

        if (!state.isDrawing) return;
        if (state.tool === 'freehand') {
            state.freehandPoints.push([rel.x, rel.y]);
            state.tempDrawings = [{ type: 'freehand', points: state.freehandPoints, color: state.color, lineWidth: state.lineWidth }];
            renderDrawings();
        }
    }

    function handlePointerUp() {
        if (state.tool === 'select') { state.isDragging = false; return; }
        if (state.isDrawing && state.tool === 'freehand') {
            if (state.freehandPoints.length > 1) {
                const payload = {
                    points: state.freehandPoints,
                    color: state.color,
                    lineWidth: state.lineWidth
                };
                state.drawings.push({ type: 'freehand', ...payload });
                pushHistory();
                sendToServer({ type: 'draw_freehand', payload });
            }
            state.freehandPoints = [];
            state.tempDrawings = [];
            state.isDrawing = false;
            renderDrawings();
            return;
        }
        if (state.isDrawing && state.tool !== 'freehand') {
            const imgPos = canvasToImage(lastX, lastY);
            const relEnd = toImageRelative(imgPos.x, imgPos.y);
            const dist = Math.hypot(relEnd.x - state.startX, relEnd.y - state.startY);
            if (dist >= 0.005) {
                const item = {
                    type: 'shape',
                    tool: state.tool,
                    color: state.color,
                    lineWidth: state.lineWidth,
                    x1: state.startX,
                    y1: state.startY,
                    x2: relEnd.x,
                    y2: relEnd.y
                };
                state.drawings.push(item);
                pushHistory();
                sendToServer({ type: 'draw', payload: item });
                renderDrawings();
            }
        }
        state.isDrawing = false;
        state.freehandPoints = [];
        state.tempDrawings = [];
    }

    // ========== ДЕЙСТВИЯ ==========
    function onApplyMap() {
        const map = mapSelect.value;
        if (!map) return;
        sendToServer({ type: 'load_map', map });
        state.map = map;
        loadMap(map);
    }

    function onClearDrawings() {
        if (!confirm('Очистить все рисунки?')) return;
        state.drawings = [];
        pushHistory();
        sendToServer({ type: 'clear' });
        renderDrawings();
    }

    // ========== ЗАПУСК ==========
    init();
})();
</script>
</body>
</html>
